<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caldera Business</title>
<style>
:root{
  --font:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --stage:#e4e4e6;--outer:#f6f6f7;--white:#ffffff;--fill:#f0f0f1;--fill2:#e8e8ea;--line:#e9e9eb;
  --text:#18181b;--muted:#71717a;--faint:#a1a1aa;
  --accent:#f47a1f;--accent-soft:#fff1e5;--pos:#22a861;--neg:#e5484d;--ink:#232326;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--stage);font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

/* page chrome */
.page{padding:20px 16px 40px;max-width:1240px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:500 14px/1 var(--font);padding:10px 14px;border-radius:999px;background:#fff;border:0;color:var(--text);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--text);color:#fff}
.view{display:none}.view.on{display:block}
.fit{transform-origin:0 0}

/* canvases: the cropped compositions, like the references */
.canvas{position:relative;overflow:hidden;background:var(--stage)}
.canvas.c-pay{width:1200px;height:1300px}
.canvas.c-cash{width:1200px;height:1300px}
.canvas.c-mob{width:600px;height:1000px;display:grid;place-items:center}
.canvas .desk{position:absolute}
.c-pay .desk{left:56px;top:120px;height:1060px}
.c-cash .desk{left:56px;top:120px;height:1060px}

/* ---------- desktop ---------- */
.desk{width:1440px;background:var(--outer);border-radius:22px;display:grid;grid-template-columns:272px 1fr;padding:10px;overflow:hidden}
.side{padding:0 6px 0 0;display:flex;flex-direction:column}
.team{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:14px;padding:10px 12px 10px 10px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:26px;height:19px}
.team small{display:block;font:400 13px/1.2 var(--font);color:var(--muted)}
.team b{display:block;font:500 16px/1.25 var(--font)}
.team .ud{margin-left:auto;color:var(--muted)}
.search{margin-top:8px;height:40px;border-radius:11px;background:var(--fill);display:flex;align-items:center;gap:10px;padding:0 12px;font:400 15px/1 var(--font);color:var(--muted)}
.search .k{margin-left:auto;font-size:14px;color:var(--faint)}
.nav{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.nav a{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:11px;font:400 15.5px/1 var(--font);color:var(--muted)}
.nav a.on{background:var(--white);color:var(--text);font-weight:500}
.nav a .c{margin-left:auto;min-width:22px;height:22px;border-radius:6px;background:var(--fill2);color:var(--text);font:500 13px/22px var(--font);text-align:center;padding:0 6px}
.nav hr{border:0;height:1px;background:var(--line);margin:10px 12px}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 12px;border-bottom:1px solid var(--line)}
.ava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.user b{display:block;font:500 15px/1.2 var(--font)}
.user span{font:400 13px/1.3 var(--font);color:var(--muted)}
.user .mode{margin-left:auto;color:var(--muted)}
.copy{font:400 11.5px/1 var(--font);color:var(--faint);text-align:center;padding:12px 0 6px}

.panel{background:var(--white);border-radius:16px;padding:30px 36px;overflow:hidden;position:relative}
.crumb{font:400 16px/1 var(--font);color:var(--muted)}
.crumb b{color:var(--text);font-weight:500}
.crumb em{font-style:normal;margin-left:6px}
h1{font:700 34px/1.1 var(--font);letter-spacing:-.02em;margin-top:26px}
.bar{display:flex;align-items:center;gap:14px;margin-top:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:3px}
.seg span{height:32px;padding:0 13px;border-radius:8px;display:flex;align-items:center;font:400 15px/1 var(--font);color:var(--muted)}
.seg span.on{background:var(--white);color:var(--text);font-weight:500}
.chip{height:38px;padding:0 13px;border-radius:11px;background:var(--fill);display:flex;align-items:center;gap:9px;font:500 15px/1 var(--font)}
.vsep{width:1px;height:24px;background:var(--line)}

.tbl{margin-top:26px;position:relative}
.th{display:grid;height:40px;align-items:center;background:var(--fill);border-radius:11px;padding:0 14px;font:400 14.5px/1 var(--font);color:var(--muted)}
.th>span{display:flex;align-items:center;gap:8px}
.th>span+span:before{content:"";width:1px;height:12px;background:#d4d4d8;margin-right:10px}
.th .n{min-width:22px;height:22px;border-radius:6px;background:var(--fill2);color:var(--text);font:500 13px/22px var(--font);text-align:center}
.tr{display:grid;height:54px;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font:400 15px/1 var(--font)}
.tr .r,.th .r{justify-content:flex-end;text-align:right}
.payee{display:flex;align-items:center;gap:12px}
.payee svg{flex:none}
.lt{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:500 13px/1 var(--font);flex:none}
.tag{display:inline-flex;height:26px;align-items:center;padding:0 9px;border-radius:7px;background:var(--fill);font:400 14px/1 var(--font)}
.st{display:inline-flex;align-items:center;gap:7px;font:400 14px/1 var(--font);color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.pop{position:absolute;background:var(--white);border:1px solid var(--line);border-radius:14px;width:250px;padding:14px 12px 10px}
.pop .hd{display:flex;justify-content:space-between;font:500 15px/1 var(--font);padding:2px 4px 0}
.pop .hd a{color:var(--accent);font-weight:400}
.pop .seg{margin-top:14px}
.pop .seg span{flex:1;justify-content:center}
.pop .search{margin-top:10px;height:36px;font-size:14.5px}
.pop hr{border:0;height:1px;background:var(--line);margin:10px 0 6px}
.pop .opt{display:flex;align-items:center;justify-content:space-between;padding:6px 4px}
.pop .opt.sel .tag{background:var(--fill2)}
.cursor{position:absolute;width:20px;height:24px;pointer-events:none}

.cards{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:26px;width:1300px}
.ccard{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 22px 16px}
.ccard h3{display:flex;align-items:center;gap:9px;font:500 16px/1 var(--font)}
.ccard h3 em{font-style:normal;margin-left:auto;font:400 14px/1 var(--font);color:var(--muted)}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;border-radius:56px;background:#1a1a1a;padding:11px;position:relative}
.scr{width:100%;height:100%;border-radius:45px;overflow:hidden;background:var(--white);position:relative}
.status{position:relative;z-index:3;height:52px;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 36px;font:600 16px/1 var(--font)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:4}
.pad{padding:0 22px}
.mh{display:flex;align-items:center;justify-content:space-between;padding-top:12px}
.mh .t{font:400 17px/1.2 var(--font);color:#52525b;display:flex;align-items:center;gap:6px}
.mh .t svg{color:#c4c4c8}
.dd{height:36px;padding:0 10px 0 13px;border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;gap:6px;font:500 16px/1 var(--font)}
.mbig{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.mbig b{font:500 38px/1.1 var(--font);letter-spacing:-.02em}
.mbig span{font:500 16.5px/1 var(--font);color:#3f3f46}
.mbig span em{font-style:normal;color:var(--pos)}
.mchips{display:flex;gap:7px;margin-top:16px;padding-bottom:16px}
.mchips span{height:36px;padding:0 13px;border-radius:10px;background:#f6f6f7;display:flex;align-items:center;font:500 16px/1 var(--font);color:#3f3f46}
.mchips span.on{background:var(--accent-soft);color:var(--accent)}
.div{height:1px;background:var(--line)}
.bars{position:relative;height:176px;margin:20px 22px 0;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end}
.bars i{display:block;border-radius:7px;background:#f0f0f2}
.bars i.on{background:var(--accent)}
.tgt{position:absolute;left:0;right:0;display:flex;align-items:center}
.tgt .pill{position:relative;height:28px;padding:0 10px 0 12px;background:var(--ink);color:#fff;border-radius:7px 0 0 7px;font:500 14px/28px var(--font);white-space:nowrap}
.tgt .pill:after{content:"";position:absolute;right:-10px;top:0;border-left:10px solid var(--ink);border-top:14px solid transparent;border-bottom:14px solid transparent}
.tgt .ln{flex:1;margin-left:16px;border-top:1.6px dashed var(--ink);position:relative}
.tgt .ln:before,.tgt .ln:after{content:"";position:absolute;top:-4.3px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.tgt .ln:before{left:-3px}.tgt .ln:after{right:-3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:9px 22px 14px}
.days span{height:28px;display:grid;place-items:center;font:400 15px/1 var(--font);color:var(--faint);border-radius:7px}
.days span.on{background:var(--accent-soft);color:var(--accent)}
.utabs{display:flex;gap:26px;padding:0 22px;border-bottom:1px solid var(--line)}
.utabs span{padding:15px 0 14px;font:400 17.5px/1 var(--font);color:#52525b;position:relative}
.utabs span.on{color:var(--text)}
.utabs span.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}
.mt{padding:14px 22px 0}
.mt .hr,.mt .row{display:grid;grid-template-columns:1fr 92px 64px;align-items:center}
.mt .hr{font:400 15px/1 var(--font);color:var(--faint);padding-bottom:4px}
.mt .hr div{display:flex;align-items:center}
.mt .row{padding:9px 0}
.mchart{padding:16px 22px 0}
.mchart svg{display:block;overflow:visible}
.ul{padding:4px 22px 0}
.ul .row{display:flex;align-items:center;gap:12px;padding:10px 0}
.ul .row svg{width:34px;height:34px;flex:none}
.ul b{display:block;font:400 16.5px/1.25 var(--font)}
.ul .s{font:400 14.5px/1.4 var(--font);color:var(--faint)}
.ul .s.now{color:var(--accent)}
.ul .a{margin-left:auto;font:400 16.5px/1 var(--font)}
/* payment detail sheet, after the transaction pin */
.scr.dim{background:#d6d6d9}
.sheet{position:absolute;left:0;right:0;top:60px;bottom:0;background:var(--white);border-radius:38px 38px 0 0;overflow:hidden}
.grab{position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:#c9c9ce;z-index:2}
.more{position:absolute;top:22px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--text);z-index:2}
.hero{position:relative;z-index:1;text-align:center;padding-top:58px}
.pin{display:inline-flex;flex-direction:column;align-items:center}
.pin i{display:none}
.hero .nm{font:500 18px/1.2 var(--font);margin-top:8px}
.hero .am{font:600 40px/1.15 var(--font);letter-spacing:-.025em;margin-top:2px}
.hero .tm{font:400 15.5px/1.3 var(--font);color:var(--muted);margin-top:2px}
.apc{margin:22px 16px 0;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:14px 18px 16px;position:relative;z-index:1}
.apc .h{display:flex;align-items:center;gap:6px;font:500 13.5px/1 var(--font);color:var(--muted)}
.apc .h svg:last-child{margin-left:auto;color:var(--faint)}
.apc .l{display:flex;justify-content:space-between;margin-top:9px;font:400 17px/1.2 var(--font)}
.apc .l em{font-style:normal;color:var(--accent);font-weight:500}
.prog{display:flex;gap:4px;margin-top:14px}
.prog i{flex:1;height:7px;border-radius:4px;background:#fde4d0}
.prog i.on{background:var(--accent)}
.kv{padding:12px 22px 0;position:relative;z-index:1}
.kv .r{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font:400 16.5px/1.2 var(--font)}
.kv .r span{color:var(--muted);display:flex;align-items:center;gap:5px}
.kv .r b{font-weight:400;display:flex;align-items:center;gap:7px}
.kv hr{border:0;height:1px;background:var(--line);margin:8px 0}
.help{position:absolute;left:0;right:0;bottom:34px;display:flex;align-items:center;justify-content:center;gap:8px;font:400 15.5px/1 var(--font);color:var(--muted);border-top:1px solid var(--line);padding-top:22px;margin:0 22px}
.help img{width:20px;height:20px}
.sheet .homebar{position:absolute;bottom:8px;left:50%;margin-left:-67px}
.mt .row b{display:block;font:400 16.5px/1.25 var(--font)}
.mt .row span{font:400 14.5px/1.5 var(--font);color:var(--faint)}
.mt .v,.mt .d{font:400 16.5px/1 var(--font)}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* glass tab bar, after the Nourish pin */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:6px 18px 0;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.82));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.ask{border-radius:26px;background:rgba(255,255,255,.75);padding:9px 0 10px}
.ask .in{display:flex;align-items:center;gap:10px;padding:0 14px 0 9px}
.ask .plus{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.ask .ph{font:400 17px/1 var(--font);color:var(--faint)}
.ask .mic{margin-left:auto;color:var(--faint)}
.ask .qs{display:flex;gap:7px;margin-top:10px;padding-left:9px;overflow:hidden;white-space:nowrap}
.ask .qs span{height:34px;padding:0 13px;border-radius:999px;background:rgba(24,24,27,.06);display:flex;align-items:center;font:500 15px/1 var(--font);color:#3f3f46;flex:none}
.tb{display:grid;grid-template-columns:repeat(3,1fr);place-items:center;height:76px;color:#9b9ba3}
.tb>span{width:52px;height:52px;display:grid;place-items:center}
.tb .on{color:var(--text)}
.tb .orb{width:42px;height:42px}
.tb .orb img{width:100%;height:100%;display:block}
.homebar{width:134px;height:5px;border-radius:3px;background:#111;margin:4px auto 8px}

/* ---------- dashboard (after the Catalyst pin) ---------- */
.canvas.c-dash{width:1680px;height:1050px}
.c-dash .desk{left:120px;top:38px}
.desk.dk{height:auto}
.dk .panel{padding:26px 28px 28px}
.dhead{display:flex;align-items:flex-start;justify-content:space-between}
.dhead .dact{margin-top:-12px}
.dhead h1{margin-top:22px}
.dact{display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;border-radius:11px;background:var(--fill);display:grid;place-items:center;color:var(--text);position:relative}
.ib i{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--fill)}
.dact .chip{height:40px}
.dact .chip .dn{color:var(--muted);margin-left:2px}
.cta{height:40px;padding:0 15px 0 12px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:8px;font:500 15px/1 var(--font)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.dc{border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px;display:flex;flex-direction:column;min-width:0}
.dc .top{display:flex;justify-content:space-between;align-items:flex-start}
.dc .tt{font:400 15px/1.2 var(--font);color:var(--muted)}
.dc .vv{display:flex;align-items:center;gap:10px;margin-top:8px}
.dc .vv b{font:500 30px/1.1 var(--font);letter-spacing:-.02em}
.bd{height:24px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;font:500 13.5px/1 var(--font)}
.bd.p{background:#e6f5ec;color:#178a4e}.bd.n{background:#fdecec;color:#d13b40}
.sb{height:32px;padding:0 11px;border-radius:9px;background:var(--fill);display:flex;align-items:center;font:500 14px/1 var(--font);color:var(--text)}
.dc .seg{margin-top:16px}
.dc .seg span{flex:1;justify-content:center;height:28px;font-size:14px}
.dc svg.ch{display:block;overflow:visible}
.kl{margin-top:auto}
.kl .r{display:grid;grid-template-columns:1fr auto 74px;align-items:center;gap:10px;height:34px;font:400 15px/1 var(--font)}
.kl .r>span:first-child{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.kl .r .ico{color:var(--muted);display:flex}
.dl{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.dl.p{color:var(--pos)}.dl.n{color:var(--neg)}
.dvd{height:1px;background:var(--line);margin:16px 0}
.cols3{flex:1;display:grid;grid-template-columns:repeat(3,1fr)}
.cols3>div{display:flex;flex-direction:column;padding:0 14px;border-left:1px dashed #dcdce0}
.cols3>div:first-child{padding-left:0;border-left:0}
.cols3>div:last-child{padding-right:0}
.cols3 .l{font:400 14.5px/1 var(--font);color:var(--faint)}
.cols3 .v{font:500 22px/1 var(--font);margin-top:12px;letter-spacing:-.01em}
.cols3 .spark{flex:1;display:flex;align-items:flex-end;gap:3px;padding:18px 0 14px}
.cols3 .spark i{flex:1;border-radius:2px;background:var(--fill)}
.cols3 .dl{justify-content:flex-start;font:400 14.5px/1 var(--font)}
.cols3 .cb{height:8px;border-radius:4px;margin-top:12px}
.stk{display:flex;gap:4px;margin-top:4px}
.stk i{height:10px;border-radius:5px}
.lg{display:flex;gap:18px;margin-top:14px;font:400 14px/1 var(--font);color:#52525b}
.lg span{display:flex;align-items:center;gap:7px}
.lg i{width:8px;height:8px;border-radius:50%}
.mt3 .h,.mt3 .r{display:grid;grid-template-columns:1fr 56px 74px;align-items:center}
.mt3 .h{font:400 13.5px/1 var(--font);color:var(--faint);padding-bottom:6px}
.mt3 .r{height:40px;font:400 15px/1 var(--font)}
.mt3 .r .payee{gap:10px;white-space:nowrap;overflow:hidden}
.mt3 .r .payee svg{width:24px;height:24px}
.mt3 .x,.mt3 .h .x{text-align:right}
.ob{margin-top:12px;height:38px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;font:500 14.5px/1 var(--font)}
.note{margin-top:12px;height:34px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 11px;font:400 13.5px/1 var(--font);color:#52525b}
.note svg{color:#c4c4c8;flex:none}
.tog{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;height:34px;margin-top:14px;font:400 14px/1 var(--font);color:#3f3f46}
.tog span{display:flex;align-items:center;justify-content:center;gap:7px}
.tog span+span{border-left:1px solid var(--line);margin:7px 0}
.tog i{width:8px;height:8px;border-radius:50%}

</style>
</head>
<body>
<div class="page" id="page">
  <div class="tabs" role="group" aria-label="Screen">
    <button data-s="dash" aria-pressed="true">Desktop · Dashboard</button>
    <button data-s="pay" aria-pressed="false">Desktop · Payments</button>
    <button data-s="cash" aria-pressed="false">Desktop · Cash flow</button>
    <button data-s="mob" aria-pressed="false">Mobile · Home</button>
    <button data-s="mob2" aria-pressed="false">Mobile · Chart</button>
    <button data-s="mob3" aria-pressed="false">Mobile · Payment</button>
  </div>
  <div id="views"></div>

function curve(pts){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`;}
  return d;
}
function lineChart({w,h,labels,fn,band,color,tip,tipX,xl,hiIdx}){
  const L=64,T=14,B=44,R=8,cw=w-L-R,ch=h-T-B,n=40,pts=[],up=[],lo=[];
  for(let i=0;i<=n;i++){const t=i/n,v=fn(t),x=+(L+t*cw).toFixed(1);pts.push([x,+(T+ch*(1-v)).toFixed(1)]);
    const b=band?band*Math.pow(t,1.6):0;up.push([x,+(T+ch*(1-v-b)).toFixed(1)]);lo.push([x,+(T+ch*(1-v+b*.7)).toFixed(1)]);}
  const area=band?`<path d="${curve(up)} L${lo.slice().reverse().map(p=>p.join(',')).join(' L')} Z" fill="${color}" opacity=".09"/>`:'';
  const yl=labels.map((l,i)=>{const y=T+ch*(1-i/(labels.length-1));return `<text x="${L-14}" y="${y+5}" text-anchor="end" font-size="14" fill="#71717a" font-family="-apple-system,system-ui">${l}</text>`}).join('');
  const tx=L+tipX*cw,ty=T+ch*(1-fn(tipX));
  let tipg='';
  if(tip){const cx=document.createElement('canvas').getContext('2d');cx.font='500 14px -apple-system,system-ui';const m=cx.measureText(tip);
    const pad=8,tw=m.width,cap=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent,bw=tw+pad*2,bh=cap+pad*2,by=ty-bh-10;
    tipg=`<line x1="${tx}" x2="${tx}" y1="${ty}" y2="${T+ch}" stroke="#52525b" stroke-width="1.2"/><rect x="${tx-bw/2}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="#232326"/><text x="${tx}" y="${by+pad+m.actualBoundingBoxAscent}" text-anchor="middle" font-size="14" fill="#fff" font-weight="500" font-family="-apple-system,system-ui">${tip}</text>`;}
  const xs=xl.map((l,i)=>{const x=L+[0.03,tipX,1][i]*cw;return `<text x="${x}" y="${h-8}" text-anchor="${i===2?'end':i===0?'start':'middle'}" font-size="14" fill="${i===hiIdx?'#f47a1f':'#71717a'}" font-family="-apple-system,system-ui">${l}</text>`}).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}">${yl}<line x1="${L}" x2="${L}" y1="${T-6}" y2="${T+ch}" stroke="#e4e4e7"/><line x1="${L}" x2="${L+cw}" y1="${T+ch}" y2="${T+ch}" stroke="#e4e4e7"/>${area}<path d="${curve(pts)}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>${tipg}${xs}</svg>`;
}

function mchart(W,H){
  const n=48,T=56,B=28,ch=H-T-B,today=.62,pts=[],up=[],lo=[];
  const fn=t=>.30+.34*Math.pow(t,1.4)+.05*Math.sin(t*8.5)*(1-t*.6);
  for(let i=0;i<=n;i++){const t=i/n,x=+(t*W).toFixed(1),v=fn(t);pts.push([x,+(T+ch*(1-v)).toFixed(1)]);
    const b=t<today?0:.20*Math.pow((t-today)/(1-today),1.2);up.push([x,+(T+ch*(1-v-b)).toFixed(1)]);lo.push([x,+(T+ch*(1-v+b*.7)).toFixed(1)]);}
  const grid=[0,.33,.66,1].map(p=>`<line x1="0" x2="${W}" y1="${T+ch*p}" y2="${T+ch*p}" stroke="#ececee" ${p<1?'stroke-dasharray="3 5"':''}/>`).join('');
  const k=Math.round(today*n),past=pts.slice(0,k+1),fut=pts.slice(k);
  const band=`<path d="${curve(up.slice(k))} L${lo.slice(k).reverse().map(p=>p.join(',')).join(' L')} Z" fill="#f47a1f" opacity=".1"/>`;
  const area=`<path d="${curve(past)} L${past[past.length-1][0]},${T+ch} L0,${T+ch} Z" fill="url(#mg)"/>`;
  const [tx,ty]=pts[k];
  const cx=document.createElement('canvas').getContext('2d');cx.font='500 14px -apple-system,system-ui';const tip='₹4,82,15,600',m=cx.measureText(tip);
  const pad=8,bw=m.width+pad*2,bh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent+pad*2,by=ty-bh-14;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="mg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f47a1f" stop-opacity=".16"/><stop offset="1" stop-color="#f47a1f" stop-opacity="0"/></linearGradient></defs>${grid}${area}${band}
   <path d="${curve(past)}" fill="none" stroke="#f47a1f" stroke-width="2.6" stroke-linecap="round"/>
   <path d="${curve(fut)}" fill="none" stroke="#f47a1f" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 6"/>
   <line x1="${tx}" x2="${tx}" y1="${ty}" y2="${T+ch}" stroke="#52525b" stroke-width="1.2"/><circle cx="${tx}" cy="${ty}" r="5.5" fill="#fff" stroke="#f47a1f" stroke-width="2.6"/>
   <rect x="${tx-bw/2}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="#232326"/><text x="${tx}" y="${by+pad+m.actualBoundingBoxAscent}" text-anchor="middle" font-size="14" font-weight="500" fill="#fff" font-family="-apple-system,system-ui">${tip}</text>
   <text x="0" y="${H-4}" font-size="14" fill="#a1a1aa" font-family="-apple-system,system-ui">7 Oct</text><text x="${tx}" y="${H-4}" text-anchor="middle" font-size="14" fill="#f47a1f" font-family="-apple-system,system-ui">Today</text><text x="${W}" y="${H-4}" text-anchor="end" font-size="14" fill="#a1a1aa" font-family="-apple-system,system-ui">7 Dec</text></svg>`;
}
function mobile2(){
  let s=mobile();
  const rows=[['tax','TDS · October','Due today','₹3,12,400',1],['tax','GST · GSTR-3B','20 Nov · ready to sign','₹6,72,350'],['sib','LC 0412 · Sibkomplekt','28 Nov · documents','9.8M ₽'],['team','Payroll · 48 people','30 Nov · NEFT','₹31,86,200']]
    .map(r=>`<div class="row">${LOGO[r[0]]}<div><b>${r[1]}</b><span class="s ${r[4]?'now':''}">${r[2]}</span></div><span class="a num">${r[3]}</span></div>`).join('');
  const body=`<div class="pad"><div class="mh"><div class="t">INR balance ${ic('info',18)}</div><span class="dd">Monthly ${ic('down',16,2)}</span></div><div class="mbig"><b class="num">₹4.82 Cr</b><span><em>+8.1%</em> vs October</span></div>
    <div class="mchips"><span class="on">INR</span><span>RUB</span><span>USD</span></div></div>
   <div class="div"></div>
   <div class="mchart">${mchart(324,236)}</div>
   <div class="div" style="margin-top:16px"></div>
   <div class="utabs"><span class="on">Upcoming</span><span>Incoming</span><span>Outgoing</span></div>
   <div class="ul">${rows}</div>
   `;
  const a=s.indexOf('<div class="pad">'),b=s.indexOf('<div class="dock">');
  s=s.slice(0,a)+body+s.slice(b);
  s=s.replace(`<span class="on">${ic('home',26)}</span>`,`<span>${ic('home',26)}</span>`).replace(`<span>${ic('chart',27,1.8)}</span>`,`<span class="on">${ic('chart',27,1.8)}</span>`);

  for(let i=1;i<rows;i++)g+=`<line x1="0" x2="${W}" y1="${i*B/rows}" y2="${i*B/rows}" stroke="#ececee"/>`;
  const mk=(a)=>`M0,${B} `+a.map(([x,y])=>`L${(x*W).toFixed(1)},${(B-y*B).toFixed(1)}`).join(' ')+` L${(a[a.length-1][0]*W).toFixed(1)},${B} Z`;
  const back=[[0,.42],[.08,.5],[.16,.36],[.25,.58],[.31,.42],[.4,.5],[.43,.82],[.5,.62],[.55,.98],[.6,.62],[.66,.86],[.72,.42],[.8,.22],[.86,0]];
  const front=[[0,.16],[.08,.26],[.16,.13],[.24,.36],[.3,.14],[.38,.3],[.43,.66],[.47,.52],[.53,.8],[.57,.42],[.6,.12],[.66,.5],[.72,0]];
  const m=['JUN','JUL','AUG','SEP','OCT','NOV'].map((t,i)=>`<text x="${(i+.5)*W/cols}" y="${H-4}" text-anchor="middle" font-size="12.5" letter-spacing=".04em" fill="#a1a1aa" ${F}>${t}</text>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%"><defs><clipPath id="ac"><rect width="${W}" height="${B}" rx="8"/></clipPath></defs>${g}<g clip-path="url(#ac)"><path d="${mk(back)}" fill="#fde6d4"/><path d="${mk(front)}" fill="${C1}"/></g>${m}</svg>`;
}
function heat(W){
  const n=12,gap=3,cw=(W-gap*(n-1))/n,chh=13,shades=['#f47a1f','#f69a57','#f8b27f','#fbcaa5','#fde1cb','#feeee2'];
  let s='';
  for(let r=0;r<n;r++)for(let c=0;c<n-r;c++){
    let k=c===0?(r%3===2?1:0):Math.min(5,Math.max(1,Math.round(1+c*.35+rng()*2.4-(r>2&&r<5&&c<5?1.3:0))));
    s+=`<rect x="${(c*(cw+gap)).toFixed(1)}" y="${r*(chh+gap)}" width="${cw.toFixed(1)}" height="${chh}" rx="2.5" fill="${shades[k]}"/>`;}
  const H=n*(chh+gap)+20;
  for(let c=0;c<n;c++)s+=`<text x="${(c*(cw+gap)+cw/2).toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="12.5" fill="#a1a1aa" ${F}>${c+1}</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function radar(W,H){
  const cx=W/2,cy=H/2+2,R=70,ax=['Liquidity','Collections','FX hedge','Tax on time','Runway','Credit use','Supplier mix','Approvals'];
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/8;return [+(cx+Math.cos(a)*r).toFixed(1),+(cy+Math.sin(a)*r).toFixed(1)]};
  let g='';
  [1,.66,.33].forEach((k,j)=>g+=`<polygon points="${ax.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="#e4e4e7" ${j?'stroke-dasharray="3 4"':''}/>`);
  ax.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ececee"/>`});
  const ser=(vals,col,op)=>{const p=vals.map((v,i)=>pt(i,R*v));return `<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`+p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.4" fill="#fff" stroke="${col}" stroke-width="1.6"/>`).join('')};
  const a=ser([.9,.62,.4,.95,.78,.52,.7,.86],C1,.1),b=ser([.62,.82,.7,.55,.6,.8,.42,.5],C3,.04);
  const cxm=document.createElement('canvas').getContext('2d');cxm.font='400 13px -apple-system,system-ui';
  const lb=ax.map((t,i)=>{const [x0,y]=pt(i,R+26),s=Math.sin(i*Math.PI/4),x=x0+s*(i%4?14:0),w=cxm.measureText(t).width+16,h=24;
    const X=Math.min(W-w,Math.max(0,x-w/2));
    return `<rect x="${X}" y="${y-h/2}" width="${w}" height="${h}" rx="7" fill="#fff" stroke="#e9e9eb"/><text x="${X+w/2}" y="${y+4.5}" text-anchor="middle" font-size="13" fill="#3f3f46" ${F}>${t}</text>`}).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%">${g}${b}${a}${lb}</svg>`;
}

function fit(){document.querySelectorAll('.view.on .fit').forEach(f=>{const c=f.firstElementChild;if(only){f.style.transform='none';return}
  const s=Math.min(1,f.parentElement.clientWidth/c.offsetWidth);f.style.transform=`scale(${s})`;f.parentElement.style.height=c.offsetHeight*s+'px';});}
function show(k){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.dataset.v===k));document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===k));fit();}
